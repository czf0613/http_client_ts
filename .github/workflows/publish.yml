name: Publish npm

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify release version
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const tag = process.env.GITHUB_REF_NAME;
          assert.ok(tag === pkg.version || tag === `v${pkg.version}`, 'Release tag must match package.json version');
          assert.equal(lock.version, pkg.version);
          assert.equal(lock.packages[''].version, pkg.version);
          assert.equal(pkg.name, '@czf0613/http_client');
          assert.ok(!pkg.version.includes('-'), 'Prerelease versions need a separate release policy');
          console.log(`Publishing ${pkg.name}@${pkg.version} from ${tag}`);
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm test

      - name: Publish with npm trusted publishing
        run: npm publish --access public
